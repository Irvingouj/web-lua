<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lua Notebook</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
</head>
<body>
  <div id="app" data-testid="app-root">
    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="logo">🌙</span>
        <h1 class="topbar-title">Lua Notebook</h1>
      </div>
      <div class="topbar-right">
        <button class="btn-icon" id="btn-toggle-theme" title="Toggle dark mode">🌓</button>
        <span id="kernel-status" data-testid="kernel-status" class="kernel-badge kernel-stopped">Kernel: stopped</span>
      </div>
    </header>

    <!-- Toolbar -->
    <nav class="toolbar">
      <div class="toolbar-group">
        <button class="btn btn-exec" id="btn-run-all" data-testid="run-all-button" title="Run all cells (Shift+Enter from last cell)">▶ Run All</button>
        <button class="btn btn-stop" id="btn-stop" data-testid="stop-button" title="Stop execution">■ Stop</button>
        <button class="btn" id="btn-restart" data-testid="restart-kernel-button" title="Restart kernel">↻ Restart</button>
      </div>
      <div class="toolbar-sep"></div>
      <div class="toolbar-group">
        <button class="btn" id="btn-add-cell" data-testid="add-cell-button" title="Add new code cell">+ Code</button>
        <button class="btn" id="btn-add-md" data-testid="add-md-button" title="Add new markdown cell">+ Markdown</button>
        <button class="btn" id="btn-clear" data-testid="clear-outputs-button" title="Clear all outputs">Clear Outputs</button>
      </div>
      <div class="toolbar-sep"></div>
      <div class="toolbar-group">
        <button class="btn" id="btn-save" data-testid="save-button" title="Save notebook (.json)">↓ Save</button>
        <button class="btn" id="btn-load" data-testid="load-button" title="Load notebook (.json)">↑ Load</button>
      </div>
    </nav>

    <!-- Canvas -->
    <main class="canvas">
      <div id="cells-container" data-testid="cells-container"></div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      Powered by <a href="https://github.com/kyren/piccolo" target="_blank" rel="noopener">piccolo</a> ·
      <a href="https://www.lua.org" target="_blank" rel="noopener">Lua</a>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
