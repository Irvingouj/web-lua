[workspace]
resolver = "2"
members = [
    "crates/piccolo",
    "crates/web-lua-core",
    "crates/web-lua-base",
    "crates/web-lua",
    "crates/extension-lua",
    "crates/web-lua-plugin-crypto",
    "crates/dom-semantic-tree",
    "crates/web-fs",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Irving Ou"]
license = "LicenseRef-PiccoloNotebook-Fair-BYOK-1.0"

[workspace.dependencies]
piccolo = { path = "crates/piccolo" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
url = "2"
dom-semantic-tree = { path = "crates/dom-semantic-tree" }
web-fs = { path = "crates/web-fs" }
