[workspace]
resolver = "2"
members = [
    "crates/piccolo-notebook-core",
    "crates/piccolo-notebook-wasm",
    "crates/notebook-plugin-crypto",
]
exclude = [
    "vendor/piccolo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
piccolo = { path = "vendor/piccolo" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
url = "2"
