[workspace]
resolver = "2"
members = [
    "crates/piccolo",
    "crates/piccolo-notebook-core",
    "crates/piccolo-notebook-wasm",
    "crates/notebook-plugin-crypto",
    "crates/dom-snapshot-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Irving Ou"]
license = "LicenseRef-PiccoloNotebook-Fair-BYOK-1.0"

[workspace.dependencies]
piccolo = { path = "crates/piccolo" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.3", features = ["wasm_js"] }
url = "2"
dom-semantic-tree = { git = "https://github.com/Irvingouj/dom-semantic-tree.git", features = ["wasm"] }
