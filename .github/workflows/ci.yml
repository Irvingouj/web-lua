name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy -p web-lua-core -p web-lua-base -p web-lua -p extension-lua -p web-lua-plugin-crypto -p dom-semantic-tree --no-deps -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build WASM targets
        run: node scripts/build.js

      - name: Verify API docs generated
        run: |
          test -f crates/web-lua/js/API.md
          test -f crates/web-lua/js/api.json
          test -f crates/extension-lua/js/API.md
          test -f crates/extension-lua/js/api.json
