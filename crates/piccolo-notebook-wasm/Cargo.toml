[package]
name = "piccolo-notebook-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
piccolo-notebook-core = { path = "../piccolo-notebook-core" }
wasm-bindgen = "0.2"
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
tsify = "0.5"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "WorkerGlobalScope",
  "Request",
  "RequestInit",
  "Response",
  "Headers",
  "AbortSignal",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
