[package]
name = "dom-snapshot-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dom-semantic-tree.workspace = true
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "HtmlSelectElement",
  "HtmlButtonElement",
  "HtmlAnchorElement",
  "HtmlImageElement",
  "HtmlLabelElement",
  "HtmlOptionElement",
  "Node",
  "NodeList",
  "Window",
  "DomRect",
  "CssStyleDeclaration",
  "HtmlCollection",
  "CharacterData",
]
