[package]
name = "web-lua"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
web-lua-base = { path = "../web-lua-base" }
web-lua-core = { path = "../web-lua-core" }
dom-semantic-tree = { workspace = true }
web-fs = { path = "../web-fs" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
tsify = "0.5"
data-encoding = "2.6"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Document",
  "Element",
  "Node",
  "NodeList",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlButtonElement",
  "HtmlTextAreaElement",
  "HtmlSelectElement",
  "HtmlOptionElement",
  "Location",
  "History",
  "Storage",
  "Request",
  "RequestInit",
  "Response",
  "Headers",
  "AbortSignal",
  "AbortController",
  "MouseEvent",
  "MouseEventInit",
  "KeyboardEvent",
  "KeyboardEventInit",
  "UiEvent",
  "UiEventInit",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
